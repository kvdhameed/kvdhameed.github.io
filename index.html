    .cursor-pattern {
      position: fixed;

      height: 480px;
      z-index: 45;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;

      border-radius: 50%;
      transform: translate3d(-520px,-520px,0);
      background-image:
        radial-gradient(circle at center, rgba(7,63,67,.26) 1px, transparent 1.4px),
        linear-gradient(rgba(23,116,122,.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,116,122,.11) 1px, transparent 1px);

      mix-blend-mode: multiply;
      transition: opacity .28s ease;
      will-change: opacity, transform;

    .button-primary:hover { background: var(--deep-2); box-shadow: 0 18px 34px rgba(7,63,67,.25); }
    .button-accent { background: var(--lime); color: var(--deep); box-shadow: 0 14px 28px rgba(213,239,116,.25); }

    .button-sm { min-height: 42px; border-radius: 12px; padding-inline: 16px; }

    .page-transition {
      position: fixed;
      inset: 0;
      z-index: 300;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      color: white;
    }
    .transition-panel { position: absolute; inset: 0; transform: translate3d(-110%,0,0); will-change: transform; }
    .transition-panel-a { background: var(--lime); }
    .transition-panel-b { background: var(--aqua); clip-path: polygon(0 0,100% 0,97% 100%,0 100%); }
    .transition-panel-c { background: var(--deep); clip-path: polygon(0 0,100% 0,94% 100%,0 100%); }
    .transition-pattern { position: absolute; inset: 0; z-index: 1; opacity: .2; background-image: radial-gradient(circle, var(--aqua) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: linear-gradient(100deg, transparent 12%, black 62%); mask-image: linear-gradient(100deg, transparent 12%, black 62%); }
    .transition-content { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; text-align: center; opacity: 0; transform: translateY(16px); }
    .transition-monogram { position: relative; width: 72px; height: 72px; display: grid; place-items: center; margin-bottom: 22px; border-radius: 23px; color: var(--lime); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); font: 800 49px/1 "Manrope", sans-serif; }
    .transition-monogram::before, .transition-monogram::after { content: ""; position: absolute; inset: -10px; border: 1px solid rgba(128,216,199,.22); border-radius: 29px; animation: transitionOrbit 2.6s linear infinite; }
    .transition-monogram::after { inset: -20px; border-style: dashed; animation-direction: reverse; animation-duration: 4s; }
    .transition-overline { display: block; color: rgba(255,255,255,.48); font-size: 9px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    .transition-route { display: block; margin-top: 8px; font: 800 clamp(29px,4vw,48px)/1 "Manrope", sans-serif; letter-spacing: -.05em; }

    .cart-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(4,31,34,.5); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .3s ease; }

    .toast { position: fixed; z-index: 250; left: 50%; bottom: 28px; transform: translate(-50%, 100px); opacity: 0; display: flex; align-items: center; gap: 9px; padding: 13px 17px; border-radius: 13px; background: var(--deep); color: white; box-shadow: var(--shadow); font-size: 12px; font-weight: 600; pointer-events: none; }

      .section { padding: 75px 0; }

      .section-head { display: grid; gap: 22px; }
      .category-grid, .product-grid, .package-grid, .values-grid { grid-template-columns: 1fr; }

      .catalog-toolbar { align-items: stretch; flex-direction: column; }
      .search-wrap { max-width: none; }
      .feature-banner-copy { padding: 37px 25px; }
      .banner-list { grid-template-columns: 1fr; }
      .feature-banner-image { min-height: 310px; }
      .review-featured { padding: 28px; }
      .page-hero { padding: 55px 0 47px; }
      .story-grid { gap: 38px; }
      .story-visual { min-height: 400px; }
      .timeline { grid-template-columns: repeat(2,1fr); row-gap: 30px; }
      .timeline::before { display: none; }
      .contact-panel, .contact-form-card, .checkout-card, .summary-card { padding: 25px; }
      .form-grid, .collection-options { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: repeat(2,1fr); gap: 35px; }
      .footer-contact { grid-column: 1/-1; }
      .footer-bottom { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    @media (hover: none), (pointer: coarse) {
      .cursor-pattern { display: none; }
    }
  </style>
</head>

    function MousePattern() {
      const patternRef = useRef(null);

      useEffect(() => {
        const pattern = patternRef.current;
        const precisePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
        if (!pattern || !precisePointer.matches) return;

        let x = window.innerWidth / 2;
        let y = window.innerHeight / 2;
        let frame = 0;
        let idleTimer = 0;

        const paint = () => {
          pattern.style.transform = `translate3d(${x - 240}px, ${y - 240}px, 0)`;
          frame = 0;
        };
        const hide = () => pattern.classList.remove("active");
        const move = event => {
          x = event.clientX;
          y = event.clientY;
          pattern.classList.add("active");
          if (!frame) frame = requestAnimationFrame(paint);
          clearTimeout(idleTimer);
          idleTimer = window.setTimeout(hide, 900);
        };

        window.addEventListener("pointermove", move, { passive: true });
        document.documentElement.addEventListener("mouseleave", hide);
        window.addEventListener("blur", hide);
        return () => {
          window.removeEventListener("pointermove", move);
          document.documentElement.removeEventListener("mouseleave", hide);
          window.removeEventListener("blur", hide);
          cancelAnimationFrame(frame);
          clearTimeout(idleTimer);
        };
      }, []);

      return <div ref={patternRef} className="cursor-pattern" aria-hidden="true"></div>;
    }

    function App() {
      const [route, setRoute] = useState(getInitialRoute);
      const [cart, setCart] = useState(restoreCart);
      const [cartOpen, setCartOpen] = useState(false);
      const [toast, setToast] = useState("");
      const toastTimer = useRef(null);
      const routeRef = useRef(route);
      const validRoutes = ["home","tests","packages","about","contact","checkout"];

      useEffect(() => {
        localStorage.setItem("kd-cart", JSON.stringify(cartForStorage(cart)));
      }, [cart]);

      useEffect(() => {
        if (!window.Lenis) return;
        const lenis = new window.Lenis({ duration: 1.1, smoothWheel: true, wheelMultiplier: .9, touchMultiplier: 1.15 });
        let frame;
        const raf = time => { lenis.raf(time); frame = requestAnimationFrame(raf); };
        frame = requestAnimationFrame(raf);
        return () => { cancelAnimationFrame(frame); lenis.destroy(); };
      }, []);

      useEffect(() => {
        if (!window.barba) return;
        try {
          window.barba.init({
            prevent: () => true,
            transitions: [{ name: "react-page-bridge", sync: true }]
          });
        } catch (error) {
          console.info("Barba lifecycle bridge already initialized.");
        }
      }, []);

      const animatePageIn = () => {
        if (!window.gsap || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const content = document.querySelector(".page-content");
        if (!content) return;
        const nearViewport = selector => [...content.querySelectorAll(selector)].filter(element => element.getBoundingClientRect().top < window.innerHeight * 1.25);
        const reveals = nearViewport(".reveal");
        const cards = nearViewport(".stagger-card");
        window.gsap.fromTo(reveals, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: .48, stagger: .045, ease: "power3.out", clearProps: "transform,opacity" });
        window.gsap.fromTo(cards, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .44, stagger: .035, delay: .07, ease: "power3.out", clearProps: "transform,opacity" });
      };

      useEffect(() => {
        const frame = requestAnimationFrame(animatePageIn);
        return () => cancelAnimationFrame(frame);
      }, [route]);

      const commitRoute = next => {
        routeRef.current = next;
        setRoute(next);
        window.scrollTo(0, 0);
        try { window.barba?.hooks?.do?.("afterEnter", { next: { namespace: next } }); } catch {}
      };

      const navigate = requested => {
        const next = validRoutes.includes(requested) ? requested : "home";
        if (next === routeRef.current) { window.scrollTo({top:0,behavior:"smooth"}); return; }
        const overlay = document.querySelector(".page-transition");
        try { window.barba?.hooks?.do?.("beforeLeave", { current: { namespace: routeRef.current }, next: { namespace: next } }); } catch {}
        if (window.gsap && overlay && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          const panels = overlay.querySelectorAll(".transition-panel");
          const content = overlay.querySelector(".transition-content");
          const meter = overlay.querySelector(".transition-meter span");
          const label = overlay.querySelector(".transition-route");
          const currentPage = document.querySelector(".page-content");
          label.textContent = routeLabels[next] || "Krishna Diagnostics";
          window.gsap.killTweensOf([overlay, content, meter, currentPage, ...panels]);

          window.gsap.timeline({ defaults: { overwrite: true } })
            .set(overlay, { autoAlpha: 1, pointerEvents: "auto" })
            .set(panels, { xPercent: -110 })
            .set(content, { autoAlpha: 0, y: 16 })
            .set(meter, { scaleX: 0, transformOrigin: "left" })
            .to(currentPage, { opacity: .18, y: -8, duration: .14, ease: "power2.in" }, 0)
            .to(panels, { xPercent: 0, duration: .26, stagger: .025, ease: "expo.inOut" }, 0)
            .to(content, { autoAlpha: 1, y: 0, duration: .14, ease: "power3.out" }, .12)
            .to(meter, { scaleX: 1, duration: .25, ease: "power2.inOut" }, .1)
            .add(() => {
              window.location.hash = `/${next}`;
              commitRoute(next);
            }, .29)
            .to(content, { autoAlpha: 0, y: -10, duration: .12, ease: "power2.in" }, .37)
            .to(panels, { xPercent: 110, duration: .31, stagger: { each: .025, from: "end" }, ease: "expo.inOut" }, .4)
            .set(overlay, { autoAlpha: 0, pointerEvents: "none" });
        } else {
          window.location.hash = `/${next}`;
          commitRoute(next);
        }
      };

      useEffect(() => {
        const onHash = () => {
          const next = getInitialRoute();
          if (next !== routeRef.current) commitRoute(validRoutes.includes(next) ? next : "home");
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      const showToast = message => {
        clearTimeout(toastTimer.current);
        setToast("");
        requestAnimationFrame(() => setToast(message));
        toastTimer.current = setTimeout(() => setToast(""), 2900);
      };

      const addToCart = item => {
        setCart(current => {
          const exists = current.some(existing => existing.id === item.id && existing.type === item.type);
          if (exists) { showToast("This item is already in your cart"); return current; }
          showToast(`${item.name} added to cart`);
          return [...current, item];
        });
      };
      const removeFromCart = item => { setCart(current => current.filter(existing => !(existing.id === item.id && existing.type === item.type))); showToast("Item removed"); };
      const clearCart = () => setCart([]);

      let page;
      if (route === "tests") page = <TestsPage addToCart={addToCart}/>;
      else if (route === "packages") page = <PackagesPage addToCart={addToCart}/>;
      else if (route === "about") page = <AboutPage navigate={navigate}/>;
      else if (route === "contact") page = <ContactPage showToast={showToast}/>;
      else if (route === "checkout") page = <CheckoutPage cart={cart} clearCart={clearCart} navigate={navigate} showToast={showToast}/>;
      else page = <HomePage navigate={navigate} addToCart={addToCart}/>;

      return (
        <div className="app" data-barba="wrapper">
          <MousePattern />
          <div className="page-transition" aria-hidden="true">
            <div className="transition-panel transition-panel-a"></div>
            <div className="transition-panel transition-panel-b"></div>
            <div className="transition-panel transition-panel-c"></div>
            <div className="transition-pattern"></div>
            <div className="transition-content">
              <div className="transition-monogram">+</div>
              <span className="transition-overline">Krishna Diagnostics · Khammam</span>
              <strong className="transition-route">Welcome home</strong>
              <div className="transition-meter"><span></span></div>
            </div>
          </div>
          <Header route={route} navigate={navigate} cartCount={cart.length} openCart={() => setCartOpen(true)}/>
          <main className="page-content" data-barba="container" data-barba-namespace={route} key={route}>{page}</main>
          <Footer navigate={navigate}/>
          <CartDrawer open={cartOpen} close={() => setCartOpen(false)} cart={cart} remove={removeFromCart} navigate={navigate}/>
          <div className={`toast ${toast ? "show" : ""}`} key={toast}><CheckCircle2 size={16}/>{toast}</div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
