<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SHA Hospital — advanced diagnostics, health packages and home sample collection in Khammam." />
  <meta name="theme-color" content="#d92721" />
  <title>SHA Hospital | Khammam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "DM Sans", sans-serif;
      --font-display: "Manrope", sans-serif;
      --color-forest: #d92721;
      --color-forest-dark: #2d2525;
      --color-mint: #ffe9e4;
      --color-coral: #a56d00;
      --color-cream: #fffaf6;
      --color-ink: #332b2a;
    }
  </style>
  <style>
    :root {
      --forest: #d92721;
      --forest-dark: #2d2525;
      --mint: #ffe9e4;
      --coral: #a56d00;
      --cream: #fffaf6;
      --ink: #332b2a;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: "DM Sans", sans-serif; overflow-x: hidden; }
    h1, h2, h3, h4, .font-display { font-family: "Manrope", sans-serif; letter-spacing: -0.035em; }
    ::selection { background: #f6cfc5; color: #2d2525; }
    .noise { position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"); }
    .page-grid { background-image: linear-gradient(rgba(217,39,33,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(217,39,33,.055) 1px, transparent 1px); background-size: 52px 52px; }
    .soft-shadow { box-shadow: 0 22px 60px rgba(70,30,27,.12); }
    .card-shadow { box-shadow: 0 12px 32px rgba(70,30,27,.09); }
    .text-balance { text-wrap: balance; }
    .clip-pill { border-radius: 999px; }
    .hero-blob { border-radius: 46% 54% 60% 40% / 44% 38% 62% 56%; }
    .service-image { transition: transform .7s cubic-bezier(.2,.8,.2,1); }
    .service-card:hover .service-image { transform: scale(1.06); }
    .package-card { transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; }
    .package-card:hover { transform: translateY(-6px); box-shadow: 0 22px 55px rgba(70,30,27,.14); border-color: rgba(217,39,33,.28); }
    .nav-link { position: relative; }
    .nav-link::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -7px; height: 2px; background: var(--coral); transition: right .25s ease; }
    .nav-link:hover::after, .nav-link.active::after { right: 0; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .float-a { animation: floatA 7s ease-in-out infinite; }
    .float-b { animation: floatB 8s ease-in-out infinite; }
    @keyframes floatA { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
    @keyframes floatB { 0%,100%{transform:translateY(0) rotate(2deg)} 50%{transform:translateY(10px) rotate(-1deg)} }
    .marquee-track { animation: marquee 25s linear infinite; min-width: max-content; }
    @keyframes marquee { to { transform: translateX(-50%); } }
    .input-field { width: 100%; border: 1px solid #eadbd5; background: white; border-radius: 14px; padding: 13px 15px; color: #332b2a; outline: none; transition: box-shadow .2s, border-color .2s; }
    .input-field:focus { border-color: #d92721; box-shadow: 0 0 0 4px rgba(217,39,33,.1); }
    .input-field::placeholder { color: #a48f88; }
    .interactive-hero { --mx: 68%; --my: 44%; isolation: isolate; }
    .hero-hover-pattern {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='68' height='68' viewBox='0 0 68 68' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M34 24v20M24 34h20' fill='none' stroke='%23d92721' stroke-width='1.4' stroke-linecap='round' opacity='.65'/%3E%3Ccircle cx='4' cy='4' r='1.8' fill='%23b88816' opacity='.9'/%3E%3C/svg%3E");
      background-size: 68px 68px;
      -webkit-mask-image: radial-gradient(circle 270px at var(--mx) var(--my), #000 0%, rgba(0,0,0,.82) 44%, transparent 100%);
      mask-image: radial-gradient(circle 270px at var(--mx) var(--my), #000 0%, rgba(0,0,0,.82) 44%, transparent 100%);
      transition: opacity .32s ease;
    }
    .hero-hover-aura {
      position: absolute;
      z-index: 0;
      left: var(--mx);
      top: var(--my);
      width: 430px;
      aspect-ratio: 1;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,39,33,.15) 0%, rgba(184,136,22,.09) 36%, rgba(255,233,228,.08) 56%, transparent 72%);
      transition: opacity .35s ease;
    }
    .hero-hover-aura::before,
    .hero-hover-aura::after {
      content: "";
      position: absolute;
      inset: 19%;
      border: 1px solid rgba(217,39,33,.18);
      border-radius: 42% 58% 54% 46% / 48% 40% 60% 52%;
      animation: orbitSpin 12s linear infinite;
    }
    .hero-hover-aura::after { inset: 30%; border-color: rgba(165,109,0,.25); animation-direction: reverse; animation-duration: 9s; }
    .interactive-hero:hover .hero-hover-pattern { opacity: .72; }
    .interactive-hero:hover .hero-hover-aura { opacity: 1; }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }
    .toast-in { animation: toastIn .35s cubic-bezier(.2,.8,.2,1); }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%,20px) scale(.96); } to { opacity:1; transform:translate(-50%,0) scale(1); } }
    .check-pop { animation: checkPop .55s cubic-bezier(.2,1.4,.3,1); }
    @keyframes checkPop { from { transform: scale(.25) rotate(-15deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    @media (hover: none), (pointer: coarse) {
      .hero-hover-pattern, .hero-hover-aura { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="noise"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    gsap.registerPlugin(ScrollTrigger);

    const LOGO = "./ShaGroup-Logo-tr.png";
    const images = {
      doctor: "https://images.unsplash.com/photo-1651008376811-b90baee60c1f?auto=format&fit=crop&w=1400&q=85",
      lab: "https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=1200&q=85",
      mri: "https://images.unsplash.com/photo-1516841273335-e39b37888115?auto=format&fit=crop&w=1200&q=85",
      radiology: "https://images.unsplash.com/photo-1584982751601-97dcc096659c?auto=format&fit=crop&w=1200&q=85",
      team: "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1400&q=85",
      home: "https://images.unsplash.com/photo-1612277795421-9bc7706a4a34?auto=format&fit=crop&w=1200&q=85"
    };

    const packages = [
      { id: 1, name: "Whole Body Checkup", original: 16400, price: 8500, category: "Comprehensive", icon: "✦", desc: "A broad, preventive health assessment designed for a complete view of your wellbeing.", features: ["Comprehensive screening", "Physician review", "Digital reports"], popular: true },
      { id: 2, name: "Viral Fever Profile Screening", original: 15150, price: 8500, category: "Fever", icon: "◌", desc: "A focused screening profile for evaluating common causes and indicators of viral fever.", features: ["Fever markers", "Lab screening", "Digital reports"] },
      { id: 3, name: "Master Health Checkup", original: 12140, price: 5500, category: "Comprehensive", icon: "✚", desc: "A balanced annual health assessment covering key organ systems and risk markers.", features: ["Annual wellness", "Multi-system profile", "Great value"], popular: true },
      { id: 4, name: "Woman Health Check Up", original: 10500, price: 5800, category: "Women", icon: "♡", desc: "Thoughtfully assembled preventive screening for women across essential health markers.", features: ["Women-focused", "Preventive profile", "Private reporting"] },
      { id: 5, name: "Cardiac Profile Checkup", original: 10890, price: 6000, category: "Heart", icon: "♥", desc: "A focused assessment of important cardiovascular health and metabolic indicators.", features: ["Heart health", "Risk markers", "Expert reporting"] },
      { id: 6, name: "PCOS Blood Test at Home", original: 8050, price: 5500, category: "Women", icon: "⌂", desc: "Convenient, privacy-first hormonal screening with home sample collection.", features: ["Home collection", "Hormonal profile", "Convenient booking"] },
      { id: 7, name: "Executive Diabetic Health Checkup", original: 6340, price: 3500, category: "Diabetes", icon: "◇", desc: "An expanded diabetes profile to support regular monitoring and preventive care.", features: ["Expanded profile", "Diabetes monitoring", "Digital reports"] },
      { id: 8, name: "Hormonal Health Check Up", original: 6200, price: 4000, category: "Hormones", icon: "◎", desc: "Key hormone investigations for a clearer picture of endocrine wellbeing.", features: ["Hormone screening", "Automated analysis", "Confidential results"] },
      { id: 9, name: "Anaemia Profile Checkup", original: 5900, price: 3500, category: "Blood", icon: "◒", desc: "A dedicated profile to investigate common markers related to anaemia.", features: ["Blood profile", "Nutrient markers", "Accurate analysis"] },
      { id: 10, name: "General Health Checkup", original: 5750, price: 3000, category: "Comprehensive", icon: "✣", desc: "An accessible routine health screen for essential wellness markers.", features: ["Routine screening", "Essential markers", "Affordable care"] },
      { id: 11, name: "Kidney Health Checkup", original: 5220, price: 2800, category: "Organ Health", icon: "≈", desc: "A targeted panel for assessing important indicators of kidney health.", features: ["Renal profile", "Key biomarkers", "Clear reporting"] },
      { id: 12, name: "Surgical Profile", original: 5200, price: 3200, category: "Specialised", icon: "＋", desc: "A convenient pre-procedure laboratory profile, performed by appointment.", features: ["Pre-procedure", "Core investigations", "Fast reporting"] },
      { id: 13, name: "Diabetic Health Checkup", original: 5040, price: 2500, category: "Diabetes", icon: "◇", desc: "Essential diabetes monitoring in one convenient and affordable package.", features: ["Glucose monitoring", "Key markers", "Regular follow-up"] },
      { id: 14, name: "Nutrient Panel Checkup", original: 4600, price: 2800, category: "Nutrition", icon: "❋", desc: "Selected nutrient markers to help identify common nutritional gaps.", features: ["Nutrient screening", "Wellness insights", "Digital results"] },
      { id: 15, name: "Haemolytic Profile Checkup", original: 4250, price: 2500, category: "Blood", icon: "◒", desc: "Specialised laboratory markers used in the evaluation of haemolytic conditions.", features: ["Specialised profile", "Quality analysis", "Pathology review"] },
      { id: 16, name: "Bone Checkup", original: 3840, price: 2000, category: "Organ Health", icon: "⌁", desc: "Important markers associated with bone strength and mineral wellbeing.", features: ["Bone markers", "Mineral profile", "Preventive insight"] },
      { id: 17, name: "General Fever Profile Checkup", original: 3640, price: 2000, category: "Fever", icon: "◌", desc: "Core investigations to support the clinical evaluation of fever.", features: ["Core fever panel", "Timely results", "Lab screening"] },
      { id: 18, name: "Health Screen Profile", original: 3550, price: 2000, category: "Comprehensive", icon: "✦", desc: "A compact preventive screening profile for essential health indicators.", features: ["Essential screen", "Preventive care", "Value package"] },
      { id: 19, name: "Liver Health Checkup", original: 3320, price: 1800, category: "Organ Health", icon: "⌇", desc: "A focused laboratory profile covering important liver health indicators.", features: ["Liver profile", "Core markers", "Digital report"] },
      { id: 20, name: "Dental Profile", original: 1640, price: 1000, category: "Specialised", icon: "◡", desc: "Relevant baseline investigations commonly requested for dental procedures.", features: ["Baseline tests", "Quick booking", "Affordable profile"] },
      { id: 21, name: "Electrolytes Profile Checkup", original: 600, price: 500, category: "Specialised", icon: "↯", desc: "Essential electrolyte measurements delivered with reliable automated analysis.", features: ["Electrolyte panel", "Fast processing", "Accurate results"] },
      { id: 22, name: "Blood Urea & Serum Creatinine", original: 500, price: 400, category: "Organ Health", icon: "≈", desc: "Two important renal markers combined in a simple, accessible profile.", features: ["Two key markers", "Renal screening", "Quick results"] }
    ];

    const facilities = [
      { title: "96-Slice CT Scan", label: "Precision imaging", image: images.radiology, desc: "CT Head, HR-CT, Neck, Chest, Abdomen, Spine and CT-guided FNAC biopsy." },
      { title: "1.5 Tesla MRI", label: "96-channel clarity", image: images.mri, desc: "Comprehensive MRI scans for the head, spine, neck, chest and more." },
      { title: "Advanced Laboratory", label: "Reliable analysis", image: images.lab, desc: "Automated haematology, biochemistry, hormones, microbiology and histopathology." }
    ];

    const branches = [
      { name: "SHA Hospital", tag: "Branch 1", address: "Thrimurth Towers, Beside City Bus Stand, Old Municipal Office Road, Khammam", phones: ["70329 96647", "087424 66664", "08742-224570"], accent: "bg-forest" },
      { name: "SHA Hospital", tag: "Branch 2", address: "Near Dr. Gorkey Hospital, Wyra Road, Khammam", phones: ["81216 51600", "087424 64996"], accent: "bg-coral" },
      { name: "SHA Hospital CT/MRI Centre", tag: "Imaging", address: "Kamala Medical Hall Road, Beside City Bus Stand, Khammam", phones: ["087424 64997", "81251 84943"], accent: "bg-[#2d2525]" }
    ];

    const formatPrice = n => `₹${n.toLocaleString("en-IN")}`;

    function Icon({ name, size = 20, strokeWidth = 1.8, className = "" }) {
      const paths = {
        arrow: <><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></>,
        chevron: <path d="m9 18 6-6-6-6"/>,
        cart: <><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"/></>,
        menu: <><path d="M4 7h16M4 12h16M4 17h16"/></>,
        close: <path d="M18 6 6 18M6 6l12 12"/>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>,
        pin: <><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></>,
        home: <><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></>,
        clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
        check: <path d="m5 12 4 4L19 6"/>,
        plus: <path d="M12 5v14M5 12h14"/>,
        minus: <path d="M5 12h14"/>,
        trash: <><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></>,
        search: <><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></>,
        mail: <><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></>,
        calendar: <><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></>,
        shield: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></>,
        user: <><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>,
        award: <><circle cx="12" cy="8" r="6"/><path d="m8 13-2 9 6-3 6 3-2-9"/></>,
        heartbeat: <><path d="M3 12h4l2-6 4 12 2-6h6"/></>,
        info: <><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></>,
        lock: <><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></>
      };
      return <svg aria-hidden="true" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">{paths[name]}</svg>;
    }

    function useRoute() {
      const getRoute = () => (window.location.hash.replace(/^#\/?/, "") || "home").split("?")[0];
      const [route, setRoute] = useState(getRoute);
      useEffect(() => {
        const handler = () => setRoute(getRoute());
        window.addEventListener("hashchange", handler);
        return () => window.removeEventListener("hashchange", handler);
      }, []);
      return route;
    }

    function go(path) {
      window.location.hash = `#/${path}`;
    }

    function AnnouncementBar() {
      return <div className="bg-forest-dark text-white text-[12px] sm:text-[13px] tracking-wide overflow-hidden h-9 flex items-center">
        <div className="marquee-track flex items-center gap-10 whitespace-nowrap">
          {[0,1].map(copy => <React.Fragment key={copy}>
            <span className="flex items-center gap-2"><span className="text-coral">●</span> Home sample collection available</span>
            <span className="text-white/35">✦</span>
            <span>Appointments: <strong>70329 96647</strong></span>
            <span className="text-white/35">✦</span>
            <span>Serving Khammam since 2009</span>
            <span className="text-white/35">✦</span>
          </React.Fragment>)}
        </div>
      </div>;
    }

    function Header({ route, cartCount }) {
      const [menuOpen, setMenuOpen] = useState(false);
      useEffect(() => setMenuOpen(false), [route]);
      const links = [["home","Home"],["services","Services"],["packages","Health Packages"],["about","About"],["contact","Contact"]];
      return <>
        <AnnouncementBar />
        <header className="sticky top-0 z-50 border-b border-forest/10 bg-cream/90 backdrop-blur-xl">
          <div className="mx-auto flex h-[78px] max-w-[1400px] items-center justify-between px-5 sm:px-8 lg:px-12">
            <button onClick={() => go("home")} className="flex items-center gap-3 text-left" aria-label="SHA Hospital home">
              <img src={LOGO} alt="SHA Hospital logo" className="h-12 w-12 rounded-full bg-white object-contain ring-1 ring-forest/10" />
              <div>
                <div className="font-display text-[17px] font-extrabold leading-tight text-forest-dark sm:text-[19px]">SHA Hospital</div>
                <div className="text-[9px] font-bold uppercase tracking-[.22em] text-forest/70 sm:text-[10px]">Advanced Healthcare</div>
              </div>
            </button>
            <nav className="hidden items-center gap-8 lg:flex" aria-label="Main navigation">
              {links.map(([path,label]) => <button key={path} onClick={() => go(path)} className={`nav-link text-[14px] font-semibold transition-colors hover:text-forest ${route === path ? "active text-forest" : "text-ink/65"}`}>{label}</button>)}
            </nav>
            <div className="flex items-center gap-2">
              <a href="tel:+917032996647" className="hidden h-11 items-center gap-2 rounded-full border border-forest/15 px-4 text-[13px] font-bold text-forest transition hover:bg-mint sm:flex"><Icon name="phone" size={16}/> Call us</a>
              <button onClick={() => go("cart")} className="relative grid h-11 w-11 place-items-center rounded-full bg-forest text-white transition hover:bg-forest-dark" aria-label={`Cart with ${cartCount} items`}>
                <Icon name="cart" size={19}/>
                {cartCount > 0 && <span className="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-coral px-1 text-[10px] font-extrabold text-white ring-2 ring-cream">{cartCount}</span>}
              </button>
              <button onClick={() => setMenuOpen(v => !v)} className="grid h-11 w-11 place-items-center rounded-full border border-forest/15 text-forest lg:hidden" aria-expanded={menuOpen} aria-label="Toggle menu"><Icon name={menuOpen ? "close" : "menu"}/></button>
            </div>
          </div>
          {menuOpen && <div className="border-t border-forest/10 bg-cream px-5 py-4 lg:hidden">
            <nav className="flex flex-col gap-1">
              {links.map(([path,label]) => <button key={path} onClick={() => go(path)} className={`rounded-xl px-4 py-3 text-left text-sm font-bold ${route === path ? "bg-mint text-forest" : "text-ink/70"}`}>{label}</button>)}
            </nav>
          </div>}
        </header>
      </>;
    }

    function Button({ children, onClick, variant = "primary", type = "button", className = "", disabled = false }) {
      const styles = variant === "primary" ? "bg-forest text-white hover:bg-[#b91d18]" : variant === "coral" ? "bg-coral text-white hover:bg-[#855800]" : variant === "light" ? "bg-white text-forest hover:bg-mint" : "border border-forest/20 text-forest hover:bg-mint";
      return <button type={type} onClick={onClick} disabled={disabled} className={`inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-sm font-bold transition duration-300 disabled:cursor-not-allowed disabled:opacity-50 ${styles} ${className}`}>{children}</button>;
    }

    function SectionEyebrow({ children, light = false }) {
      return <div className={`mb-5 inline-flex items-center gap-2 text-[11px] font-extrabold uppercase tracking-[.22em] ${light ? "text-mint" : "text-forest"}`}><span className={`h-2 w-2 rounded-full ${light ? "bg-coral" : "bg-coral"}`}></span>{children}</div>;
    }

    function PageHero({ eyebrow, title, text }) {
      return <section className="page-grid relative overflow-hidden border-b border-forest/10 px-5 py-20 sm:px-8 sm:py-24 lg:px-12">
        <div className="absolute -right-28 -top-36 h-96 w-96 rounded-full bg-mint/70 blur-3xl"></div>
        <div className="page-enter relative mx-auto max-w-[1400px]">
          <SectionEyebrow>{eyebrow}</SectionEyebrow>
          <h1 className="max-w-4xl text-balance font-display text-4xl font-extrabold leading-[1.04] text-forest-dark sm:text-6xl lg:text-7xl">{title}</h1>

        <section className="px-5 py-20 sm:px-8 lg:px-12 lg:py-24"><div className="mx-auto max-w-[1400px]"><div className="grid gap-5 lg:grid-cols-3">{branches.map((b,i)=><article key={b.tag} className="section-reveal overflow-hidden rounded-[26px] border border-forest/10 bg-white"><div className={`h-2 ${b.accent}`}></div><div className="p-7"><span className="rounded-full bg-mint px-3 py-1 text-[10px] font-extrabold uppercase tracking-wider text-forest">{b.tag}</span><h2 className="mt-5 text-xl font-extrabold text-forest-dark">{b.name}</h2><div className="mt-5 flex items-start gap-3 text-sm leading-6 text-ink/60"><Icon name="pin" size={18} className="mt-1 shrink-0 text-coral"/>{b.address}</div><div className="mt-5 space-y-2">{b.phones.map(p=><a key={p} href={`tel:${p.replace(/\s|-/g,"")}`} className="flex items-center gap-3 text-sm font-bold text-forest hover:text-coral"><Icon name="phone" size={16}/>{p}</a>)}</div>{i===0&&<a href="mailto:sridivyadiagnostics@gmail.com" className="mt-3 flex items-center gap-3 break-all text-sm font-bold text-forest hover:text-coral"><Icon name="mail" size={16}/>sridivyadiagnostics@gmail.com</a>}</div></article>)}</div></div></section>
        <section className="page-grid bg-[#fff1ed] px-5 py-20 sm:px-8 lg:px-12 lg:py-24"><div className="mx-auto grid max-w-[1200px] overflow-hidden rounded-[34px] bg-white soft-shadow lg:grid-cols-[.8fr_1.2fr]">
          <div className="bg-forest p-8 text-white sm:p-12"><SectionEyebrow light>Appointment request</SectionEyebrow><h2 className="text-3xl font-extrabold sm:text-4xl">Tell us how we can help.</h2><p className="mt-5 text-sm leading-6 text-white/60">Share your contact details and preferred centre. Our team can call you to confirm availability and preparation instructions.</p><div className="mt-10 space-y-5"><div className="flex gap-3"><Icon name="clock" className="text-coral"/><div><strong className="block text-sm">Prior booking required</strong><span className="text-xs text-white/50">Please wait for confirmation before visiting.</span></div></div><div className="flex gap-3"><Icon name="home" className="text-coral"/><div><strong className="block text-sm">Home collection available</strong><span className="text-xs text-white/50">Ask our team about test eligibility.</span></div></div></div></div>
          <form onSubmit={submit} className="p-8 sm:p-12"><div className="grid gap-5 sm:grid-cols-2"><label className="text-xs font-bold text-ink/60">Full name<input required className="input-field mt-2" placeholder="Your name"/></label><label className="text-xs font-bold text-ink/60">Phone number<input required pattern="[0-9 +()-]{7,15}" className="input-field mt-2" placeholder="Your phone"/></label><label className="text-xs font-bold text-ink/60">Preferred branch<select required className="input-field mt-2"><option value="">Select a branch</option>{branches.map(b=><option key={b.tag}>{b.tag} — {b.name}</option>)}</select></label><label className="text-xs font-bold text-ink/60">Service<select required className="input-field mt-2"><option>Health package</option><option>CT Scan</option><option>MRI Scan</option><option>Laboratory test</option><option>Home sample collection</option><option>Other</option></select></label><label className="text-xs font-bold text-ink/60 sm:col-span-2">Message (optional)<textarea className="input-field mt-2 min-h-28 resize-y" placeholder="Tell us your preferred date or service..."></textarea></label></div><Button type="submit" className="mt-6 w-full sm:w-auto">Request a callback <Icon name="arrow" size={17}/></Button>{sent&&<div className="mt-5 flex items-start gap-3 rounded-xl bg-mint p-4 text-sm text-forest"><Icon name="check" className="mt-0.5 shrink-0"/><span><strong>Request received.</strong> Our team will contact you to confirm the appointment.</span></div>}</form>
        </div></section></main>;
    }

    function CartPage({ cart, updateQty, removeItem }) {
      const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
      const savings = cart.reduce((s,i)=>s+(i.original-i.price)*i.qty,0);
      if (!cart.length) return <main><PageHero eyebrow="Your cart" title="Your health journey starts here."/><section className="px-5 py-24 text-center"><div className="mx-auto max-w-md"><span className="mx-auto grid h-20 w-20 place-items-center rounded-full bg-mint text-forest"><Icon name="cart" size={34}/></span><h2 className="mt-7 text-3xl font-extrabold text-forest-dark">Your cart is empty</h2><p className="mt-3 text-sm leading-6 text-ink/55">Explore our preventive health packages and choose what feels right for you.</p><Button onClick={()=>go("packages")} className="mt-7">Explore packages <Icon name="arrow" size={17}/></Button></div></section></main>;
      return <main><PageHero eyebrow="Your cart" title="Review your selected health packages." text="Adjust the number of people for each package, then continue to request your appointment."/>
        <section className="px-5 py-16 sm:px-8 lg:px-12 lg:py-20"><div className="mx-auto grid max-w-[1200px] gap-8 lg:grid-cols-[1.35fr_.65fr]">
          <div className="space-y-4">{cart.map(item=><article key={item.id} className="page-enter flex flex-col gap-5 rounded-2xl border border-forest/10 bg-white p-5 sm:flex-row sm:items-center"><span className="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-mint text-xl text-forest">{item.icon}</span><div className="min-w-0 flex-1"><div className="text-[10px] font-extrabold uppercase tracking-wider text-coral">{item.category}</div><h2 className="mt-1 text-lg font-extrabold text-forest-dark">{item.name}</h2><div className="mt-1 text-sm font-bold text-forest">{formatPrice(item.price)} <span className="text-xs font-normal text-ink/40">per person</span></div></div><div className="flex items-center justify-between gap-4 sm:justify-end"><div className="flex items-center rounded-full border border-forest/15"><button onClick={()=>updateQty(item.id,-1)} className="grid h-9 w-9 place-items-center text-forest" aria-label="Decrease quantity"><Icon name="minus" size={14}/></button><span className="w-8 text-center text-sm font-bold">{item.qty}</span><button onClick={()=>updateQty(item.id,1)} className="grid h-9 w-9 place-items-center text-forest" aria-label="Increase quantity"><Icon name="plus" size={14}/></button></div><strong className="w-24 text-right text-lg text-forest-dark">{formatPrice(item.price*item.qty)}</strong><button onClick={()=>removeItem(item.id)} className="grid h-9 w-9 place-items-center rounded-full text-ink/35 transition hover:bg-red-50 hover:text-red-500" aria-label={`Remove ${item.name}`}><Icon name="trash" size={17}/></button></div></article>)}<button onClick={()=>go("packages")} className="flex items-center gap-2 px-2 pt-3 text-sm font-bold text-forest"><span className="rotate-180"><Icon name="arrow" size={16}/></span> Add another package</button></div>
          <aside className="h-fit rounded-[26px] bg-forest p-7 text-white lg:sticky lg:top-32"><h2 className="text-2xl font-extrabold">Order summary</h2><div className="mt-7 space-y-4 border-b border-white/10 pb-6"><div className="flex justify-between text-sm text-white/60"><span>Package total</span><span>{formatPrice(subtotal)}</span></div><div className="flex justify-between text-sm text-mint"><span>Your savings</span><span>− {formatPrice(savings)}</span></div></div><div className="flex items-end justify-between py-6"><span className="text-sm text-white/70">Total</span><strong className="text-3xl">{formatPrice(subtotal)}</strong></div><Button onClick={()=>go("checkout")} variant="coral" className="w-full">Continue to checkout <Icon name="arrow" size={17}/></Button><div className="mt-5 flex items-start gap-2 text-[11px] leading-5 text-white/45"><Icon name="info" size={15} className="mt-0.5 shrink-0"/>Your request is confirmed by our team. Any payment choice is finalized directly with the centre.</div></aside>
        </div></section></main>;
    }

    function CheckoutPage({ cart, completeOrder }) {
      const [done,setDone] = useState(null);
      const [method,setMethod] = useState("centre");
      const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
      const minDate = new Date().toISOString().split("T")[0];
      const submit = e => {
        e.preventDefault();
        const data = new FormData(e.currentTarget);
        const confirmation = { id: `SD-${Date.now().toString().slice(-7)}`, name:data.get("name"), phone:data.get("phone"), date:data.get("date"), branch:data.get("branch"), total:subtotal, method };
        try {
          const saved = JSON.parse(localStorage.getItem("sriDivyaBookings")) || [];
          localStorage.setItem("sriDivyaBookings", JSON.stringify([...saved, confirmation]));
        } catch {}
        setDone(confirmation); completeOrder(); window.scrollTo(0,0);
      };
      if (done) return <main className="min-h-[75vh] px-5 py-20 sm:px-8"><div className="mx-auto max-w-2xl rounded-[32px] bg-white p-7 text-center soft-shadow sm:p-12"><span className="check-pop mx-auto grid h-24 w-24 place-items-center rounded-full bg-mint text-forest"><Icon name="check" size={44} strokeWidth={2.5}/></span><div className="mt-7 text-xs font-extrabold uppercase tracking-[.2em] text-coral">Appointment request placed</div><h1 className="mt-3 text-balance text-4xl font-extrabold text-forest-dark">Thank you, {done.name}.</h1><p className="mx-auto mt-4 max-w-lg text-sm leading-6 text-ink/60">Your booking request <strong className="text-forest">{done.id}</strong> has been recorded for <strong>{new Date(done.date+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</strong>. Our team will call {done.phone} to confirm the appointment and preparation instructions.</p><div className="mt-8 grid gap-3 rounded-2xl bg-cream p-5 text-left sm:grid-cols-2"><div><span className="text-[10px] font-bold uppercase tracking-wider text-ink/40">Preferred centre</span><strong className="mt-1 block text-sm text-forest-dark">{done.branch}</strong></div><div><span className="text-[10px] font-bold uppercase tracking-wider text-ink/40">Package total</span><strong className="mt-1 block text-sm text-forest-dark">{formatPrice(done.total)}</strong></div></div><div className="mt-5 rounded-xl border border-[#e9c777] bg-[#fff8e9] p-4 text-left text-xs leading-5 text-[#75551b]"><strong>Please note:</strong> This is an appointment request, not a final clinical confirmation. Please wait for our team to contact you before visiting or beginning fasting.</div><Button onClick={()=>go("home")} className="mt-8">Return home <Icon name="arrow" size={17}/></Button></div></main>;
      if (!cart.length) return <main><PageHero eyebrow="Checkout" title="Your cart is empty."/><div className="px-5 py-20 text-center"><Button onClick={()=>go("packages")}>Browse packages</Button></div></main>;
      return <main><PageHero eyebrow="Secure checkout" title="One last step to request your appointment." text="Enter patient details and choose a preferred date. The centre will call to confirm availability."/>
        <form onSubmit={submit} className="px-5 py-16 sm:px-8 lg:px-12 lg:py-20"><div className="mx-auto grid max-w-[1200px] gap-8 lg:grid-cols-[1.15fr_.85fr]">
          <div className="space-y-6"><section className="rounded-[26px] border border-forest/10 bg-white p-6 sm:p-8"><div className="mb-7 flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-full bg-mint text-forest"><Icon name="user"/></span><div><div className="text-[10px] font-extrabold uppercase tracking-wider text-coral">Step 1</div><h2 className="text-xl font-extrabold text-forest-dark">Patient details</h2></div></div><div className="grid gap-5 sm:grid-cols-2"><label className="text-xs font-bold text-ink/60">Full name<input name="name" required autoComplete="name" className="input-field mt-2" placeholder="Patient's full name"/></label><label className="text-xs font-bold text-ink/60">Mobile number<input name="phone" required autoComplete="tel" pattern="[0-9 +()-]{7,15}" className="input-field mt-2" placeholder="Phone number"/></label><label className="text-xs font-bold text-ink/60">Email (optional)<input name="email" type="email" autoComplete="email" className="input-field mt-2" placeholder="Email address"/></label><label className="text-xs font-bold text-ink/60">Age<input name="age" required type="number" min="1" max="120" className="input-field mt-2" placeholder="Age"/></label></div></section>
          <section className="rounded-[26px] border border-forest/10 bg-white p-6 sm:p-8"><div className="mb-7 flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-full bg-mint text-forest"><Icon name="calendar"/></span><div><div className="text-[10px] font-extrabold uppercase tracking-wider text-coral">Step 2</div><h2 className="text-xl font-extrabold text-forest-dark">Appointment preference</h2></div></div><div className="grid gap-5 sm:grid-cols-2"><label className="text-xs font-bold text-ink/60">Preferred date<input name="date" required type="date" min={minDate} className="input-field mt-2"/></label><label className="text-xs font-bold text-ink/60">Preferred centre<select name="branch" required className="input-field mt-2"><option value="">Select a centre</option>{branches.map(b=><option key={b.tag} value={`${b.tag}, Khammam`}>{b.tag} — {b.name}</option>)}</select></label><label className="flex cursor-pointer items-start gap-3 rounded-xl border border-forest/10 p-4 sm:col-span-2"><input name="homeCollection" type="checkbox" className="mt-1 h-4 w-4 accent-[#d92721]"/><span><strong className="block text-sm text-forest-dark">Request home sample collection</strong><span className="mt-1 block text-xs leading-5 text-ink/50">Our team will confirm whether all selected tests are eligible and whether your address is serviceable.</span></span></label></div></section>
          <section className="rounded-[26px] border border-forest/10 bg-white p-6 sm:p-8"><div className="mb-7 flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-full bg-mint text-forest"><Icon name="lock"/></span><div><div className="text-[10px] font-extrabold uppercase tracking-wider text-coral">Step 3</div><h2 className="text-xl font-extrabold text-forest-dark">Payment preference</h2></div></div><div className="grid gap-3 sm:grid-cols-2">{[["centre","Pay at the centre","Finalize payment during your confirmed visit."],["link","Request a payment link","Ask the centre to share options after confirmation."]].map(([v,t,b])=><label key={v} className={`cursor-pointer rounded-2xl border p-5 transition ${method===v?"border-forest bg-mint/50":"border-forest/10"}`}><div className="flex items-start gap-3"><input type="radio" name="payment" value={v} checked={method===v} onChange={()=>setMethod(v)} className="mt-1 accent-[#d92721]"/><span><strong className="block text-sm text-forest-dark">{t}</strong><span className="mt-1 block text-xs leading-5 text-ink/50">{b}</span></span></div></label>)}</div></section></div>
          <aside className="h-fit rounded-[26px] bg-forest p-7 text-white lg:sticky lg:top-32"><h2 className="text-2xl font-extrabold">Booking summary</h2><div className="mt-6 space-y-4">{cart.map(i=><div key={i.id} className="flex gap-3 border-b border-white/10 pb-4"><span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white/10 text-sm">{i.icon}</span><div className="min-w-0 flex-1"><div className="text-xs font-bold leading-5">{i.name}</div><span className="text-[10px] text-white/45">{i.qty} {i.qty===1?"person":"people"}</span></div><span className="text-xs font-bold">{formatPrice(i.price*i.qty)}</span></div>)}</div><div className="mt-6 flex items-end justify-between"><span className="text-sm text-white/60">Total</span><strong className="text-3xl">{formatPrice(subtotal)}</strong></div><label className="mt-6 flex items-start gap-3 text-[11px] leading-5 text-white/60"><input required type="checkbox" className="mt-1 accent-[#a56d00]"/><span>I understand this submits an appointment request and the centre will call to confirm it.</span></label><Button type="submit" variant="coral" className="mt-6 w-full">Place appointment request <Icon name="arrow" size={17}/></Button><div className="mt-4 flex items-center justify-center gap-2 text-[10px] text-white/40"><Icon name="lock" size={13}/> Your details are used for this booking request.</div></aside>
        </div></form></main>;
    }

    function CTA() {
      return <section className="px-5 py-16 sm:px-8 lg:px-12 lg:py-20"><div className="section-reveal relative mx-auto max-w-[1400px] overflow-hidden rounded-[34px] bg-forest px-7 py-12 text-white sm:px-12 lg:px-16 lg:py-16"><div className="absolute -right-20 -top-32 h-96 w-96 rounded-full border-[60px] border-coral/25"></div><div className="absolute bottom-[-80px] left-[35%] h-52 w-52 rounded-full bg-[#b91d18]"></div><div className="relative flex flex-col justify-between gap-8 lg:flex-row lg:items-center"><div><div className="mb-4 text-[10px] font-extrabold uppercase tracking-[.22em] text-[#f2cf74]">Ready when you are</div><h2 className="max-w-3xl text-balance text-3xl font-extrabold leading-tight sm:text-5xl">Better health begins with better information.</h2></div><div className="flex shrink-0 flex-wrap gap-3"><Button onClick={()=>go("packages")} variant="light">Find a package <Icon name="arrow" size={17}/></Button><a href="tel:+917032996647" className="inline-flex min-h-12 items-center gap-2 rounded-full border border-white/30 px-6 text-sm font-bold text-white transition hover:bg-white/10"><Icon name="phone" size={17}/> 70329 96647</a></div></div></div></section>;
    }

    function Footer() {
      return <footer className="bg-forest-dark px-5 pb-8 pt-16 text-white sm:px-8 lg:px-12"><div className="mx-auto max-w-[1400px]"><div className="grid gap-12 border-b border-white/10 pb-12 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr_1.2fr]">
        <div><button onClick={()=>go("home")} className="flex items-center gap-3 text-left"><img src={LOGO} alt="SHA Hospital logo" className="h-12 w-12 rounded-full bg-white object-contain"/><div><div className="font-display text-lg font-extrabold">SHA Hospital</div><div className="text-[9px] font-bold uppercase tracking-[.2em] text-white/50">Advanced Healthcare</div></div></button><p className="mt-5 max-w-sm text-sm leading-6 text-white/50">Accurate diagnostics, advanced imaging and compassionate care for Khammam and surrounding communities.</p></div>
        <div><h3 className="text-sm font-extrabold">Explore</h3><div className="mt-5 flex flex-col items-start gap-3">{[["home","Home"],["services","Services"],["packages","Health Packages"],["about","About us"]].map(([p,l])=><button key={p} onClick={()=>go(p)} className="text-xs text-white/50 transition hover:text-coral">{l}</button>)}</div></div>
        <div><h3 className="text-sm font-extrabold">Patient care</h3><div className="mt-5 flex flex-col items-start gap-3"><button onClick={()=>go("contact")} className="text-xs text-white/50 hover:text-coral">Book appointment</button><button onClick={()=>go("packages")} className="text-xs text-white/50 hover:text-coral">Preventive checkups</button><button onClick={()=>go("contact")} className="text-xs text-white/50 hover:text-coral">Home collection</button><button onClick={()=>go("cart")} className="text-xs text-white/50 hover:text-coral">Your cart</button></div></div>
        <div><h3 className="text-sm font-extrabold">Get in touch</h3><a href="tel:+917032996647" className="mt-5 flex items-center gap-2 text-sm font-bold text-white hover:text-coral"><Icon name="phone" size={16}/>70329 96647</a><a href="mailto:sridivyadiagnostics@gmail.com" className="mt-3 block break-all text-xs text-white/50 hover:text-coral">sridivyadiagnostics@gmail.com</a><p className="mt-4 text-xs leading-5 text-white/45">Old Municipal Office Road,<br/>Khammam, Telangana</p></div>
      </div><div className="flex flex-col gap-3 pt-7 text-[10px] text-white/35 sm:flex-row sm:items-center sm:justify-between"><span>© {new Date().getFullYear()} SHA Hospital. All rights reserved.</span><span>Health information on this site is general and does not replace medical advice.</span></div></div></footer>;
    }

    function App() {
      const route = useRoute();
      const [cart,setCart] = useState(() => { try { return JSON.parse(localStorage.getItem("sriDivyaCart")) || []; } catch { return []; } });
      const [toast,setToast] = useState("");
      useEffect(()=>localStorage.setItem("sriDivyaCart",JSON.stringify(cart)),[cart]);
      useEffect(()=>{
        window.scrollTo(0,0);
        const ctx = gsap.context(()=>{
          gsap.fromTo(".page-enter",{opacity:0,y:24},{opacity:1,y:0,duration:.7,stagger:.07,ease:"power3.out"});
          gsap.fromTo(".hero-copy > *",{opacity:0,y:26},{opacity:1,y:0,duration:.8,stagger:.1,ease:"power3.out"});
          gsap.fromTo(".hero-visual",{opacity:0,scale:.94,x:30},{opacity:1,scale:1,x:0,duration:1.1,ease:"power3.out"});
          document.querySelectorAll(".section-reveal").forEach(el=>{
            gsap.fromTo(el,{opacity:0,y:35},{opacity:1,y:0,duration:.8,ease:"power3.out",scrollTrigger:{trigger:el,start:"top 88%",once:true}});
          });
          requestAnimationFrame(() => ScrollTrigger.refresh());
        });
        return ()=>ctx.revert();
      },[route]);
      useEffect(()=>{
        if (!window.Lenis) return;
        const lenis = new Lenis({duration:1.05,smoothWheel:true,wheelMultiplier:.9});
        lenis.on("scroll", ScrollTrigger.update);
        let raf;
        const tick = time => { lenis.raf(time); raf=requestAnimationFrame(tick); };
        raf=requestAnimationFrame(tick);
        return ()=>{cancelAnimationFrame(raf);lenis.destroy();};
      },[]);
      const addToCart = pkg => { setCart(c=>{const found=c.find(i=>i.id===pkg.id);return found?c.map(i=>i.id===pkg.id?{...i,qty:i.qty+1}:i):[...c,{...pkg,qty:1}]}); setToast(`${pkg.name} added to cart`); setTimeout(()=>setToast(""),2600); };
      const updateQty = (id,delta) => setCart(c=>c.map(i=>i.id===id?{...i,qty:Math.max(1,i.qty+delta)}:i));
      const removeItem = id => setCart(c=>c.filter(i=>i.id!==id));
      const cartCount = cart.reduce((s,i)=>s+i.qty,0);
      const pages = { home:<HomePage addToCart={addToCart}/>, services:<ServicesPage/>, packages:<PackagesPage addToCart={addToCart}/>, about:<AboutPage/>, contact:<ContactPage/>, cart:<CartPage cart={cart} updateQty={updateQty} removeItem={removeItem}/>, checkout:<CheckoutPage cart={cart} completeOrder={()=>setCart([])}/> };
      return <><Header route={route} cartCount={cartCount}/>{pages[route] || pages.home}<Footer/>{toast&&<div role="status" className="toast-in fixed bottom-6 left-1/2 z-[80] flex -translate-x-1/2 items-center gap-3 whitespace-nowrap rounded-full bg-forest-dark px-5 py-3 text-sm font-bold text-white shadow-2xl"><span className="grid h-6 w-6 place-items-center rounded-full bg-coral"><Icon name="check" size={14}/></span>{toast}<button onClick={()=>go("cart")} className="ml-2 text-xs text-mint underline underline-offset-4">View cart</button></div>}</>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
